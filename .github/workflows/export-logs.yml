name: Export workout logs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Runs queue instead of overlapping, so two exports never push at the same time.
concurrency:
  group: export-logs
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rows from Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/workout_logs?select=date,day,entries,warmup,cooldown,created_at&order=created_at.asc" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o "$RUNNER_TEMP/rows.json"

      - name: Write data/workout-logs.json
        run: python3 scripts/export_logs.py "$RUNNER_TEMP/rows.json" data/workout-logs.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workout-logs.json
          git diff --cached --quiet && exit 0
          git commit -m "Export workout logs"
          git push
